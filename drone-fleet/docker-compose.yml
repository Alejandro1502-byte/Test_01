services:

  mongo:
    image: mongo:7
    container_name: drones-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express:1.0.2
    container_name: drones-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"

  server:
    build: ./server
    container_name: drones-server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://admin:admin123@mongo:27017/
      DB_NAME: dronesdb
    ports:
      - "5001:5000"

  simulator:
    build: ./simulator
    container_name: drones-simulator
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://admin:admin123@mongo:27017/
      DB_NAME: dronesdb
      # USE_SITL=false #→ fallback propio (para prototipar sin ArduPilot)
      # USE_SITL=true  → conecta a ArduCopter SITL real
      USE_SITL: "false"
      SITL_HOST: host.docker.internal   # donde corre ArduCopter en tu máquina
      SITL_BASE_PORT: "14550"           # puerto UDP primer dron
      TICK_SECONDS: "0.10"              # 10 Hz de actualización
      BATTERY_DRAIN: "0.05"             # % batería por segundo en vuelo
    # Cuando USE_SITL=true exponer puertos para que SITL externo los alcance
    # ports:
    #   - "14550:14550/udp"
    #   - "14560:14560/udp"
    #   - "14570:14570/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # para Linux

  client:
    build: ./client
    container_name: drones-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo-data:
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRONE FLEET CONTROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050810;
  --bg2: #080d1a;
  --bg3: #0c1220;
  --panel: rgba(10,20,40,0.92);
  --border: #1a3a5c;
  --border-glow: #0a6ebd;
  --accent: #00d4ff;
  --accent2: #00ff9f;
  --warn: #ffb800;
  --danger: #ff3860;
  --muted: #3a5a7a;
  --text: #cde8ff;
  --text-dim: #4a7a9b;
  --grid: rgba(0,212,255,0.04);
  --en_tierra: #00ff9f;
  --volando: #00d4ff;
  --aterrizando: #ffb800;
  --mantenimiento: #ff3860;
  --s1: #00d4ff33;
  --s2: #00ff9f33;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,100,200,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ─────────────────────────────────────────────── */
#header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(10px);
}

#header .logo {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 4px;
  color: var(--accent);
  text-shadow: 0 0 20px var(--accent);
}

#header .logo span { color: var(--accent2); }

.status-bar {
  display: flex;
  gap: 24px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
}

.status-bar .item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.status-bar .val { color: var(--accent); font-size: 16px; font-family: 'Orbitron', sans-serif; }
.status-bar .val.green { color: var(--accent2); }
.status-bar .val.warn { color: var(--warn); }

#clock {
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  color: var(--accent2);
  opacity: 0.7;
}

/* ── LAYOUT ─────────────────────────────────────────────── */
#app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 340px 1fr 300px;
  grid-template-rows: 1fr;
  height: calc(100vh - 53px);
  gap: 0;
}

/* ── PANEL BASE ──────────────────────────────────────────── */
.panel {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--text-dim);
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
  text-transform: uppercase;
  flex-shrink: 0;
}

/* ── LEFT PANEL: FLEET LIST ──────────────────────────────── */
#panel-fleet {
  background: var(--panel);
}

#fleet-list {
  overflow-y: auto;
  flex: 1;
  padding: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.drone-card {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
  background: rgba(0,10,25,0.6);
}

.drone-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--muted);
  transition: all 0.15s;
}

.drone-card.en_tierra::before { background: var(--en_tierra); }
.drone-card.volando::before { background: var(--volando); box-shadow: 0 0 8px var(--volando); }
.drone-card.aterrizando::before { background: var(--warn); }
.drone-card.mantenimiento::before { background: var(--danger); }

.drone-card:hover, .drone-card.selected {
  border-color: var(--accent);
  background: rgba(0,30,60,0.8);
}

.drone-card.selected { box-shadow: 0 0 0 1px var(--accent), inset 0 0 20px rgba(0,212,255,0.05); }

.card-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.card-modelo { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
.card-badge {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 2px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.badge-en_tierra { background: rgba(0,255,159,0.15); color: var(--en_tierra); border: 1px solid rgba(0,255,159,0.3); }
.badge-volando { background: rgba(0,212,255,0.15); color: var(--volando); border: 1px solid rgba(0,212,255,0.3); }
.badge-aterrizando { background: rgba(255,184,0,0.15); color: var(--warn); border: 1px solid rgba(255,184,0,0.3); }
.badge-mantenimiento { background: rgba(255,56,96,0.15); color: var(--danger); border: 1px solid rgba(255,56,96,0.3); }

.card-row2 { display: flex; gap: 12px; align-items: center; }
.bat-bar-wrap { flex: 1; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
.bat-bar { height: 100%; border-radius: 2px; transition: width 0.5s; }
.bat-ok { background: var(--accent2); }
.bat-warn { background: var(--warn); }
.bat-low { background: var(--danger); }
.bat-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text-dim); white-space: nowrap; }
.card-pos { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: var(--text-dim); }

.btn-del-card {
  background: transparent;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 12px;
  opacity: 0.4;
  transition: opacity 0.15s;
  padding: 2px 4px;
}
.btn-del-card:hover { opacity: 1; }

/* ADD DRONE FORM */
#add-form {
  border-top: 1px solid var(--border);
  padding: 12px;
  background: rgba(0,0,0,0.3);
  flex-shrink: 0;
}

#add-form .form-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.field-row.single { grid-template-columns: 1fr; }

.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 9px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; font-family: 'Share Tech Mono', monospace; }

input[type="text"], input[type="number"] {
  background: rgba(0,20,50,0.8);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  padding: 5px 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}

input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(0,212,255,0.2); }

.btn {
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  border: none;
  border-radius: 3px;
  padding: 7px 14px;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}
.btn-primary {
  background: rgba(0,212,255,0.15);
  color: var(--accent);
  border: 1px solid var(--accent);
  width: 100%;
  margin-top: 4px;
}
.btn-primary:hover { background: rgba(0,212,255,0.28); box-shadow: 0 0 16px rgba(0,212,255,0.3); }

.btn-order {
  background: rgba(0,20,50,0.8);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  font-size: 9px;
  letter-spacing: 1px;
  transition: all 0.15s;
  width: 100%;
}
.btn-order:hover { border-color: var(--accent); color: var(--accent); }
.btn-order.danger:hover { border-color: var(--danger); color: var(--danger); }
.btn-order.warn:hover { border-color: var(--warn); color: var(--warn); }
.btn-order.green:hover { border-color: var(--accent2); color: var(--accent2); }

/* ── CENTER PANEL: MAP ───────────────────────────────────── */
#panel-map {
  border-right: 1px solid var(--border);
  background: var(--bg2);
  position: relative;
  display: flex;
  flex-direction: column;
}

#radar-canvas {
  flex: 1;
  width: 100%;
  cursor: crosshair;
}

#map-legend {
  padding: 8px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 20px;
  align-items: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  background: rgba(0,0,0,0.3);
  flex-shrink: 0;
}

.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

#click-hint {
  font-size: 10px;
  color: var(--text-dim);
  font-family: 'Share Tech Mono', monospace;
  margin-left: auto;
}

/* ── RIGHT PANEL: CONTROL + EVENTS ──────────────────────── */
#panel-right {
  background: var(--panel);
  border-right: none;
}

#panel-control {
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#selected-info {
  padding: 12px;
  min-height: 80px;
}

#sel-none {
  color: var(--text-dim);
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  padding: 20px;
  text-align: center;
}

#sel-detail { display: none; }

.sel-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 6px;
}

.sel-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.sel-stats .sv { color: var(--text); }

.orders-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  padding: 0 12px 12px;
}

#goto-form {
  padding: 0 12px 12px;
  display: none;
}

#goto-form .field-row { margin-bottom: 6px; }

/* EVENTS */
#panel-events {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-top: 1px solid var(--border);
}

#events-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.event-item {
  padding: 5px 8px;
  border-left: 2px solid var(--border);
  margin-bottom: 4px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  background: rgba(0,0,0,0.2);
  border-radius: 0 2px 2px 0;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: none; } }

.event-item.creado { border-color: var(--accent2); }
.event-item.despegar, .event-item.destino_alcanzado { border-color: var(--volando); }
.event-item.aterrizar, .event-item.aterrizaje { border-color: var(--warn); }
.event-item.bateria_critica { border-color: var(--danger); }
.event-item.mantenimiento, .event-item.activar { border-color: var(--danger); }
.event-item.recargar { border-color: var(--accent2); }

.event-ts { display: block; font-size: 9px; color: var(--muted); margin-top: 2px; }
.event-tipo { color: var(--accent); font-weight: bold; }

/* TOAST */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 1000;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  padding: 10px 16px;
  border-radius: 4px;
  border: 1px solid var(--border-glow);
  background: var(--bg3);
  color: var(--accent);
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  max-width: 280px;
}
#toast.show { opacity: 1; transform: none; }
#toast.error { border-color: var(--danger); color: var(--danger); }
#toast.ok { border-color: var(--accent2); color: var(--accent2); }

/* Pulse animation for flying drones */
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* Scrollbars */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div id="header">
  <div class="logo">DRONE<span>CTRL</span></div>
  <div class="status-bar">
    <div class="item"><span class="val green" id="stat-total">0</span><span>TOTAL</span></div>
    <div class="item"><span class="val" id="stat-flying">0</span><span>VOLANDO</span></div>
    <div class="item"><span class="val green" id="stat-tierra">0</span><span>EN TIERRA</span></div>
    <div class="item"><span class="val warn" id="stat-mant">0</span><span>MANT.</span></div>
  </div>
  <div id="clock">--:--:--</div>
</div>

<div id="app">

  <!-- LEFT: FLEET -->
  <div class="panel" id="panel-fleet">
    <div class="panel-title">◈ FLOTA</div>
    <div id="fleet-list"></div>

    <div id="add-form">
      <div class="form-title">▸ REGISTRAR DRON</div>
      <div class="field-row">
        <div class="field">
          <label>Modelo *</label>
          <input type="text" id="f-modelo" placeholder="Mavic 3">
        </div>
        <div class="field">
          <label>Fabricante *</label>
          <input type="text" id="f-fab" placeholder="DJI">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Pos X</label>
          <input type="number" id="f-x" value="50" step="1">
        </div>
        <div class="field">
          <label>Pos Y</label>
          <input type="number" id="f-y" value="50" step="1">
        </div>
      </div>
      <div class="field-row single">
        <div class="field">
          <label>Velocidad (u/tick)</label>
          <input type="number" id="f-vel" value="2" step="0.5" min="0.5">
        </div>
      </div>
      <button class="btn btn-primary" onclick="addDrone()">▸ REGISTRAR</button>
    </div>
  </div>

  <!-- CENTER: MAP -->
  <div id="panel-map">
    <div class="panel-title">◈ MAPA TÁCTICO — haz click para enviar dron seleccionado al destino</div>
    <canvas id="radar-canvas"></canvas>
    <div id="map-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--en_tierra)"></div>En tierra</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--volando)"></div>Volando</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--warn)"></div>Aterrizando</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div>Mant.</div>
      <span id="click-hint">Click en mapa → ir_a destino</span>
    </div>
  </div>

  <!-- RIGHT: CONTROL + EVENTS -->
  <div class="panel" id="panel-right">
    <div id="panel-control">
      <div class="panel-title">◈ CONTROL</div>
      <div id="selected-info">
        <div id="sel-none">[ selecciona un dron ]</div>
        <div id="sel-detail">
          <div class="sel-name" id="sel-name">—</div>
          <div class="sel-stats">
            <span>ESTADO</span><span class="sv" id="sel-estado">—</span>
            <span>BATERÍA</span><span class="sv" id="sel-bat">—</span>
            <span>POS</span><span class="sv" id="sel-pos">—</span>
            <span>DESTINO</span><span class="sv" id="sel-dest">—</span>
          </div>
        </div>
      </div>
      <div class="orders-grid" id="orders-grid">
        <button class="btn btn-order green" onclick="order('despegar')">▲ DESPEGAR</button>
        <button class="btn btn-order warn" onclick="order('aterrizar')">▼ ATERRIZAR</button>
        <button class="btn btn-order" onclick="toggleGotoForm()">⊕ IR A…</button>
        <button class="btn btn-order green" onclick="order('recargar')">⚡ RECARGAR</button>
        <button class="btn btn-order danger" onclick="order('mantenimiento')">⚠ MANT.</button>
        <button class="btn btn-order" onclick="order('activar')">✓ ACTIVAR</button>
      </div>
      <div id="goto-form">
        <div class="field-row">
          <div class="field"><label>X destino</label><input type="number" id="goto-x" step="1"></div>
          <div class="field"><label>Y destino</label><input type="number" id="goto-y" step="1"></div>
        </div>
        <button class="btn btn-primary" onclick="sendGoto()">ENVIAR DESTINO</button>
      </div>
    </div>

    <div id="panel-events" class="panel">
      <div class="panel-title">◈ REGISTRO DE EVENTOS</div>
      <div id="events-list"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'http://localhost:5001/api';
let drones = [];
let selectedId = null;
let pendingClickDest = false;

// ── Clock ──────────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-ES', {hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3200);
}

// ── Data fetching ──────────────────────────────────────────────────────────
async function fetchDrones() {
  try {
    const res = await fetch(`${API}/drones`);
    drones = await res.json();
    renderFleet();
    renderMap();
    updateStats();
    if (selectedId) updateSelectedPanel();
  } catch (e) { /* silencioso */ }
}

async function fetchEvents() {
  try {
    const res = await fetch(`${API}/eventos`);
    const events = await res.json();
    renderEvents(events);
  } catch (e) {}
}

setInterval(fetchDrones, 1500);
setInterval(fetchEvents, 2000);
fetchDrones();
fetchEvents();

// ── Stats bar ──────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('stat-total').textContent = drones.length;
  document.getElementById('stat-flying').textContent = drones.filter(d=>d.estado==='volando').length;
  document.getElementById('stat-tierra').textContent = drones.filter(d=>d.estado==='en_tierra').length;
  document.getElementById('stat-mant').textContent = drones.filter(d=>d.estado==='mantenimiento').length;
}

// ── Fleet list ─────────────────────────────────────────────────────────────
function renderFleet() {
  const list = document.getElementById('fleet-list');
  if (drones.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-family:\'Share Tech Mono\',monospace;font-size:10px;">[ sin drones registrados ]</div>';
    return;
  }
  const currentScroll = list.scrollTop;
  list.innerHTML = drones.map(d => {
    const bat = d.bateria_pct ?? 0;
    const batClass = bat > 40 ? 'bat-ok' : bat > 15 ? 'bat-warn' : 'bat-low';
    const isSelected = d.id === selectedId;
    const pos = d.posicion ? `(${d.posicion.x.toFixed(0)}, ${d.posicion.y.toFixed(0)})` : '—';
    return `
    <div class="drone-card ${d.estado} ${isSelected?'selected':''}" onclick="selectDrone('${d.id}')">
      <div class="card-row1">
        <div class="card-modelo">${d.modelo}</div>
        <span class="card-badge badge-${d.estado}">${d.estado.replace('_',' ')}</span>
        <button class="btn-del-card" onclick="event.stopPropagation();deleteDrone('${d.id}')">✕</button>
      </div>
      <div class="card-row2">
        <div class="bat-bar-wrap"><div class="bat-bar ${batClass}" style="width:${bat}%"></div></div>
        <div class="bat-label">${bat.toFixed(0)}%</div>
        <div class="card-pos">${pos}</div>
      </div>
    </div>`;
  }).join('');
  list.scrollTop = currentScroll;
}

// ── Add drone ──────────────────────────────────────────────────────────────
async function addDrone() {
  const modelo = document.getElementById('f-modelo').value.trim();
  const fabricante = document.getElementById('f-fab').value.trim();
  if (!modelo || !fabricante) { toast('Modelo y fabricante son obligatorios', 'error'); return; }
  const payload = {
    modelo, fabricante,
    x: parseFloat(document.getElementById('f-x').value) || 50,
    y: parseFloat(document.getElementById('f-y').value) || 50,
    velocidad: parseFloat(document.getElementById('f-vel').value) || 2,
  };
  try {
    const res = await fetch(`${API}/drones`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    if (!res.ok) { const e=await res.json(); throw new Error(e.error); }
    document.getElementById('f-modelo').value = '';
    document.getElementById('f-fab').value = '';
    toast('Dron registrado en flota', 'ok');
    fetchDrones();
  } catch(e) { toast(e.message, 'error'); }
}

// ── Delete drone ───────────────────────────────────────────────────────────
async function deleteDrone(id) {
  if (!confirm('¿Eliminar este dron de la flota?')) return;
  await fetch(`${API}/drones/${id}`, { method:'DELETE' });
  if (selectedId === id) { selectedId = null; updateSelectedPanel(); }
  fetchDrones();
  toast('Dron eliminado', 'ok');
}

// ── Select drone ───────────────────────────────────────────────────────────
function selectDrone(id) {
  selectedId = selectedId === id ? null : id;
  renderFleet();
  updateSelectedPanel();
}

function updateSelectedPanel() {
  const d = drones.find(x=>x.id===selectedId);
  const none = document.getElementById('sel-none');
  const detail = document.getElementById('sel-detail');
  if (!d) {
    none.style.display = 'block';
    detail.style.display = 'none';
    document.getElementById('goto-form').style.display = 'none';
    return;
  }
  none.style.display = 'none';
  detail.style.display = 'block';
  document.getElementById('sel-name').textContent = `${d.modelo} · ${d.fabricante}`;
  document.getElementById('sel-estado').textContent = d.estado.replace('_',' ').toUpperCase();
  document.getElementById('sel-bat').textContent = `${(d.bateria_pct??0).toFixed(1)}%`;
  const pos = d.posicion ? `${d.posicion.x.toFixed(1)}, ${d.posicion.y.toFixed(1)}` : '—';
  document.getElementById('sel-pos').textContent = pos;
  const dest = d.destino ? `${d.destino.x.toFixed(1)}, ${d.destino.y.toFixed(1)}` : '—';
  document.getElementById('sel-dest').textContent = dest;
}

// ── Orders ─────────────────────────────────────────────────────────────────
async function order(accion, extra={}) {
  if (!selectedId) { toast('Selecciona un dron primero', 'error'); return; }
  try {
    const res = await fetch(`${API}/drones/${selectedId}/orden`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({accion, ...extra})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    toast(data.mensaje, 'ok');
    fetchDrones();
    fetchEvents();
  } catch(e) { toast(e.message, 'error'); }
}

function toggleGotoForm() {
  const f = document.getElementById('goto-form');
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

function sendGoto() {
  const x = parseFloat(document.getElementById('goto-x').value);
  const y = parseFloat(document.getElementById('goto-y').value);
  if (isNaN(x)||isNaN(y)) { toast('Introduce coordenadas válidas', 'error'); return; }
  order('ir_a', {x, y});
  document.getElementById('goto-form').style.display = 'none';
}

// ── Canvas Map ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('radar-canvas');
const ctx = canvas.getContext('2d');
const WORLD = 100; // coordenadas de 0..100

function worldToCanvas(x, y) {
  const margin = 30;
  const w = canvas.width - margin*2;
  const h = canvas.height - margin*2;
  return [ margin + (x/WORLD)*w, margin + (1 - y/WORLD)*h ];
}

function canvasToWorld(cx, cy) {
  const margin = 30;
  const w = canvas.width - margin*2;
  const h = canvas.height - margin*2;
  return [ ((cx-margin)/w)*WORLD, (1 - (cy-margin)/h)*WORLD ];
}

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height - 36; // minus legend
}

window.addEventListener('resize', () => { resizeCanvas(); renderMap(); });
resizeCanvas();

let mapClickTs = 0;

canvas.addEventListener('click', async (e) => {
  if (!selectedId) { toast('Selecciona un dron para moverlo', 'error'); return; }
  const d = drones.find(x=>x.id===selectedId);
  if (!d || d.estado !== 'volando') { toast('El dron debe estar volando para recibir destino', 'error'); return; }

  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const [wx, wy] = canvasToWorld(cx, cy);
  const x = Math.max(0, Math.min(WORLD, wx));
  const y = Math.max(0, Math.min(WORLD, wy));

  await order('ir_a', {x: parseFloat(x.toFixed(1)), y: parseFloat(y.toFixed(1))});
});

const STATE_COLORS = {
  en_tierra: '#00ff9f',
  volando: '#00d4ff',
  aterrizando: '#ffb800',
  mantenimiento: '#ff3860',
};

let mapAnimFrame = 0;

function renderMap() {
  if (!canvas.width) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = '#060c18';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const margin = 30;
  const w = canvas.width - margin*2;
  const h = canvas.height - margin*2;

  // Grid
  ctx.strokeStyle = 'rgba(0,212,255,0.06)';
  ctx.lineWidth = 1;
  for (let i=0; i<=10; i++) {
    const gx = margin + (i/10)*w;
    const gy = margin + (i/10)*h;
    ctx.beginPath(); ctx.moveTo(gx, margin); ctx.lineTo(gx, margin+h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(margin, gy); ctx.lineTo(margin+w, gy); ctx.stroke();
  }

  // Border
  ctx.strokeStyle = 'rgba(0,212,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(margin, margin, w, h);

  // Axis labels
  ctx.fillStyle = 'rgba(0,212,255,0.25)';
  ctx.font = '9px "Share Tech Mono"';
  ctx.textAlign = 'center';
  for (let i=0; i<=10; i+=2) {
    const gx = margin + (i/10)*w;
    ctx.fillText(i*10, gx, margin-6);
  }
  ctx.textAlign = 'right';
  for (let i=0; i<=10; i+=2) {
    const gy = margin + (1-i/10)*h;
    ctx.fillText(i*10, margin-6, gy+3);
  }

  mapAnimFrame++;
  const now = Date.now();

  drones.forEach(d => {
    if (!d.posicion) return;
    const [cx, cy] = worldToCanvas(d.posicion.x, d.posicion.y);
    const col = STATE_COLORS[d.estado] || '#aaa';
    const isSelected = d.id === selectedId;

    // Draw destination line
    if (d.destino && d.estado === 'volando') {
      const [dx, dy] = worldToCanvas(d.destino.x, d.destino.y);
      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = col + '55';
      ctx.lineWidth = 1;
      ctx.moveTo(cx, cy);
      ctx.lineTo(dx, dy);
      ctx.stroke();
      ctx.setLineDash([]);

      // Destination X marker
      ctx.strokeStyle = col + '88';
      ctx.lineWidth = 1.5;
      const s = 5;
      ctx.beginPath(); ctx.moveTo(dx-s,dy-s); ctx.lineTo(dx+s,dy+s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(dx+s,dy-s); ctx.lineTo(dx-s,dy+s); ctx.stroke();
    }

    // Pulse ring for flying
    if (d.estado === 'volando') {
      const pulse = Math.sin(now/600 + d.id.charCodeAt(0)) * 0.5 + 0.5;
      ctx.beginPath();
      ctx.arc(cx, cy, 12 + pulse*6, 0, Math.PI*2);
      ctx.strokeStyle = col + '44';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Selection ring
    if (isSelected) {
      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, Math.PI*2);
      ctx.strokeStyle = '#ffffff55';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Drone dot
    ctx.beginPath();
    ctx.arc(cx, cy, d.estado === 'volando' ? 6 : 5, 0, Math.PI*2);
    ctx.fillStyle = col;
    ctx.fill();

    if (d.estado === 'en_tierra') {
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI*2);
      ctx.strokeStyle = col + 'aa';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Label
    ctx.fillStyle = isSelected ? '#fff' : (col + 'cc');
    ctx.font = isSelected ? 'bold 10px "Share Tech Mono"' : '9px "Share Tech Mono"';
    ctx.textAlign = 'left';
    ctx.fillText(d.modelo.substring(0,8), cx + 9, cy + 3);

    // Battery mini
    const batW = 18;
    const batH = 3;
    const bx = cx + 9;
    const by = cy + 7;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(bx, by, batW, batH);
    const bat = (d.bateria_pct ?? 0) / 100;
    ctx.fillStyle = bat > 0.4 ? '#00ff9f' : bat > 0.15 ? '#ffb800' : '#ff3860';
    ctx.fillRect(bx, by, batW * bat, batH);
  });

  requestAnimationFrame(renderMap);
}

renderMap();

// ── Events ─────────────────────────────────────────────────────────────────
let lastEventId = null;

function renderEvents(events) {
  const list = document.getElementById('events-list');
  if (events.length === 0) {
    list.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-family:\'Share Tech Mono\',monospace;font-size:10px;">[ sin eventos ]</div>';
    return;
  }
  const currentTop = events[0]?.id;
  if (currentTop === lastEventId) return;
  lastEventId = currentTop;

  list.innerHTML = events.slice(0, 40).map(e => {
    const ts = new Date(e.ts).toLocaleTimeString('es-ES');
    const drone = drones.find(d=>d.id===e.drone_id);
    const dname = drone ? drone.modelo : e.drone_id.substring(0,8);
    return `<div class="event-item ${e.tipo}">
      <span class="event-tipo">[${e.tipo.toUpperCase()}]</span> ${dname} — ${e.detalle || ''}
      <span class="event-ts">${ts}</span>
    </div>`;
  }).join('');
}
